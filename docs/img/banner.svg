<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">EMETH</title>
  <desc id="d">EMETH — un joueur Minecraft autonome. Corps Mineflayer, esprit Python, plugin compagnon Paper.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181E"/>
      <stop offset="0.62" stop-color="#1D2430"/>
      <stop offset="1" stop-color="#2A2420"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C46B"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E8E3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#sky)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- setting sun, pixel-stepped -->
  <g transform="translate(1010 84)">
    <rect x="-56" y="-8" width="112" height="16" fill="url(#sun)" opacity="0.95"/>
    <rect x="-48" y="-24" width="96" height="16" fill="url(#sun)"/>
    <rect x="-48" y="8" width="96" height="16" fill="url(#sun)"/>
    <rect x="-32" y="-40" width="64" height="16" fill="url(#sun)"/>
    <rect x="-32" y="24" width="64" height="16" fill="url(#sun)"/>
  </g>

  <!-- terrain: blocks -->
  <g>
    <rect x="0" y="296" width="1280" height="64" fill="#3B2A20"/>
    <rect x="0" y="280" width="1280" height="16" fill="#5E8C4F"/>
    <rect x="0" y="280" width="1280" height="4" fill="#8FA98B"/>
    <g fill="#2E2219">
      <rect x="64" y="312" width="32" height="16"/><rect x="256" y="328" width="32" height="16"/><rect x="480" y="312" width="32" height="16"/>
      <rect x="736" y="336" width="32" height="16"/><rect x="928" y="312" width="32" height="16"/><rect x="1152" y="328" width="32" height="16"/>
    </g>
    <!-- an ore in the dirt, what the miner knows how to reach -->
    <g transform="translate(1120 312)">
      <rect width="32" height="32" fill="#4A4F57"/>
      <rect x="6" y="6" width="6" height="6" fill="#7FE3E0"/><rect x="18" y="14" width="8" height="6" fill="#7FE3E0"/><rect x="8" y="20" width="6" height="6" fill="#7FE3E0"/>
    </g>
  </g>

  <!-- the agent: a blocky figure with its floating card -->
  <g transform="translate(940 168)">
    <rect x="-82" y="-74" width="164" height="42" rx="3" fill="#14181E" fill-opacity="0.82" stroke="#E0B04B" stroke-opacity="0.5"/>
    <text x="0" y="-57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#E0B04B">✦ EMETH · apprenti</text>
    <text x="0" y="-40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#E8E3D8">⛏ descend → Y -58</text>
    <rect x="-16" y="-24" width="32" height="32" fill="#C9A27A"/>
    <rect x="-10" y="-14" width="6" height="6" fill="#14181E"/><rect x="4" y="-14" width="6" height="6" fill="#14181E"/>
    <rect x="-16" y="-24" width="32" height="8" fill="#5A3E2B"/>
    <rect x="-16" y="8" width="32" height="48" fill="#2FA3A0"/>
    <rect x="-30" y="8" width="14" height="44" fill="#C9A27A"/><rect x="16" y="8" width="14" height="44" fill="#C9A27A"/>
    <rect x="-16" y="56" width="15" height="56" fill="#34495E"/><rect x="1" y="56" width="15" height="56" fill="#34495E"/>
    <!-- pickaxe -->
    <g transform="translate(36 30) rotate(-35)"><rect x="-2" y="-4" width="4" height="40" fill="#8B6A43"/><rect x="-16" y="-8" width="32" height="6" fill="#B8C2CC"/></g>
  </g>

  <!-- wordmark -->
  <g font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="148" font-size="96" font-weight="800" letter-spacing="10" fill="#E8E3D8">EMETH</text>
    <text x="440" y="148" font-size="40" font-weight="400" fill="#E0B04B" opacity="0.85">אמת</text>
    <text x="76" y="196" font-size="24" font-weight="500" fill="#E8E3D8" opacity="0.92">Un joueur Minecraft autonome, pas un chatbot avec une pioche.</text>
    <text x="76" y="232" font-size="17" fill="#9AA4B2">perçoit honnêtement · agit avec des réflexes · se souvient · apprend · gagne son autonomie</text>
  </g>
</svg>
